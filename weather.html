<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h1 class="text-center">Weather App</h1>
    <div class="row justify-content-center">
      <div class="col-md-6">
        <input type="text" id="cityInput" class="form-control" placeholder="Enter city name">
        <button id="searchBtn" class="btn btn-primary mt-3">Search</button>
      </div>
    </div>
    <div id="weatherResult" class="mt-5 text-center"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    const API_KEY = '16cfcbfe2f77d699f47a36cde7cb4ef2';
    const cityInput = document.getElementById('cityInput');
    const searchBtn = document.getElementById('searchBtn');
    const weatherResult = document.getElementById('weatherResult');

    searchBtn.addEventListener('click', () => {
      const city = cityInput.value;
      if (city) {
        fetchWeather(city);
      }
    });

    async function fetchWeather(city) {
      try {
        const response = await axios.get(
          "https://api.openweathermap.org/data/2.5/weather?units=metric&q="
        );
        const data = response.data;
        displayWeather(data);
      } catch (error) {
        weatherResult.innerHTML = <p class="text-danger">City not found. Please try again.</p>;
      }
    }

    function displayWeather(data) {
      const { name, main, weather, wind } = data;
      const weatherHTML = `
        <h2>${name}</h2>
        <p>Temperature: ${main.temp}°C</p>
        <p>Humidity: ${main.humidity}%</p>
        <p>Wind Speed: ${wind.speed} m/s</p>
        <p>Condition: ${weather[0].description}</p>
        <img src="http://openweathermap.org/img/wn/${weather[0].icon}@2x.png" alt="${weather[0].description}">
      `;
      weatherResult.innerHTML = weatherHTML;
    }
  </script>
</body>
</html>
